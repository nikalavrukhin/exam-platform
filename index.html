<!doctype html>
<!--
  ============================================================================
  index.html — ВЕСЬ фронтенд сайта в одном файле (страница ученика + админка).

  Файл состоит из трёх частей:
    1. <head>   — служебная информация о странице
    2. <style>  — CSS: как всё выглядит (цвета, отступы, шрифты)
    3. <script> — JavaScript: как всё работает (кнопки, отправка, редактор кода)

  Сайт — «одностраничный»: HTML почти пустой (<main id="app">), а весь интерфейс
  JavaScript рисует сам внутри <main>. Какую «страницу» показать — решает адрес:
      https://сайт/         → страница ученика
      https://сайт/#/admin  → вход для админа
  ============================================================================
-->
<html lang="ru"> <!-- lang="ru": язык страницы, нужен браузеру и поисковикам -->
<head>
<meta charset="UTF-8"> <!-- кодировка: без неё кириллица превратится в «кракозябры» -->
<meta name="viewport" content="width=device-width, initial-scale=1"> <!-- чтобы на телефоне сайт не был мелким, а подстраивался под экран -->
<meta name="robots" content="noindex, nofollow"> <!-- просим поисковики НЕ показывать этот сайт в выдаче -->
<meta name="color-scheme" content="light"> <!-- сайт всегда светлый, даже если у человека включена тёмная тема -->
<title>Сдача работы</title> <!-- название вкладки (потом JS заменит на заголовок из настроек) -->
<style>
/* ======================= CSS ======================= */

/* :root — это «корень» страницы. Здесь мы задаём переменные (--имя), чтобы цвета и шрифты
   менять в одном месте. Использовать переменную можно так: var(--имя) */
:root {
  --bg: #f3ece0;            /* цвет фона всей страницы (бежевый) */
  --paper: #fffdf8;         /* цвет «листа бумаги» посередине (почти белый, тёплый) */
  --code-bg: #fbf7ef;       /* цвет фона поля с кодом */
  --text: #2a2520;          /* основной цвет текста (тёмно-коричневый) */
  --muted: #8a7f70;         /* приглушённый серо-бежевый для подписей и подсказок */
  --line: #ece2d1;          /* цвет тонких разделительных линий */
  --line-strong: #dccfb8;   /* цвет линий поярче (рамки полей) */
  --ink: #2a2520;           /* «чернила» — тёмный цвет (сейчас почти не используется) */
  --ink-text: #fffdf8;      /* светлый цвет для текста на тёмном (сейчас почти не используется) */
  --accent: #b4623c;        /* акцентный цвет — терракотовый (кнопки, галочки, подсветка полей) */
  --err: #c8402f;           /* цвет ошибок (красный) */
  /* Шрифты: браузер берёт первый из списка, который есть на устройстве, дальше по очереди */
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;   /* шрифт с засечками для заголовков */
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; /* обычный системный шрифт */
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;                  /* моноширинный шрифт для кода */
}
* { box-sizing: border-box; }  /* у ВСЕХ элементов ширина включает padding и рамку — так проще считать размеры */
html { -webkit-text-size-adjust: 100%; } /* запрещаем iPhone самовольно увеличивать текст */
body {
  margin: 0;                               /* убираем стандартный отступ вокруг страницы */
  background: var(--bg);                   /* фон — бежевый */
  color: var(--text);                      /* цвет текста */
  font: 16px/1.6 var(--sans);              /* размер шрифта 16px, высота строки 1.6, шрифт sans */
  -webkit-font-smoothing: antialiased;     /* более гладкое сглаживание шрифта на Mac */
}
body { padding: 48px 16px; min-height: 100vh; display: flex; flex-direction: column; }   /* страница на всю высоту окна; колонка нужна для центрирования листа по вертикали */               /* отступы от краёв окна до «листа»: 48px сверху/снизу, 16px по бокам */
main {                                     /* «лист бумаги» — главный контейнер */
  width: 100%; max-width: 760px;           /* на всю доступную ширину, но не шире 760px */
  margin: 0 auto;                          /* по центру (авто-отступы слева и справа) */
  background: var(--paper);                /* светлый фон листа */
  border: 1px solid var(--line);           /* тонкая рамка */
  border-radius: 22px;                     /* скруглённые углы */
  padding: 52px 56px 44px;                 /* внутренние отступы: сверху, по бокам, снизу */
  box-shadow: 0 24px 60px -30px rgba(90,60,25,.22);  /* мягкая тень под листом */
  position: relative; z-index: 1;                    /* лист лежит поверх плавающих цветных пятен фона */
  transition: opacity .18s ease, transform .18s ease; /* плавное исчезновение при переходе между страницами */
}
h1 { font: 400 36px/1.2 var(--serif); letter-spacing: -.01em; margin: 0 0 8px; }  /* главный заголовок: не жирный, 36px, с засечками */
h2 { font: 400 22px/1.3 var(--serif); margin: 0; }                                 /* заголовок поменьше (названия задач) */
.lead { color: var(--muted); margin: 0 0 36px; }          /* серый подзаголовок под h1 */
hr { border: 0; border-top: 1px solid var(--line); margin: 0 0 32px; }  /* горизонтальная линия (сейчас на сайте не используется) */
.muted { color: var(--muted); }                            /* класс «приглушённый текст» */

/* ---------- поля ввода ---------- */
label {                                    /* подписи над полями («ИМЯ», «ФАМИЛИЯ») */
  display: block;                          /* каждая подпись на своей строке */
  font-size: 12px;                         /* мелкий текст */
  letter-spacing: .08em;                   /* разрядка между буквами */
  text-transform: uppercase;               /* ВСЕ БУКВЫ ЗАГЛАВНЫЕ */
  color: var(--muted);
  margin-bottom: 6px;
}
input[type=text], input[type=password], textarea.plain {   /* обычные текстовые поля */
  width: 100%;                             /* на всю ширину колонки */
  padding: 10px 2px;                       /* внутренний отступ */
  font: inherit;                           /* шрифт как у страницы (по умолчанию у полей свой, некрасивый) */
  color: var(--text);
  background: transparent;                 /* без своего фона */
  border: 0;                               /* убираем рамку со всех сторон... */
  border-bottom: 1px solid var(--line-strong);  /* ...и оставляем только линию снизу */
  border-radius: 0;
  transition: border-color .15s;           /* цвет линии меняется плавно за 0.15 сек */
}
/* когда поле выбрано (в него кликнули): */
input[type=text]:focus, input[type=password]:focus, textarea.plain:focus { outline: 0; border-color: var(--accent); }  /* убираем стандартную синюю обводку, линия становится терракотовой */
/* многострочное поле условия в админке — с полной рамкой, а не только линией снизу */
textarea.plain { resize: vertical; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper); }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding-bottom: 36px; }  /* блок «Имя / Фамилия»: две равные колонки через сетку (grid) */
.task { padding: 28px 0 12px; border-top: 1px solid var(--line); }  /* блок задачи: сверху разделительная линия */

/* ---------- задачи ---------- */
.task-head { margin-bottom: 4px; }          /* заголовок задачи */
.task-text { color: var(--muted); white-space: pre-wrap; margin: 6px 0 4px; font-size: 15px; }  /* условие задачи; pre-wrap сохраняет переносы строк, которые ввёл админ */

/* ---------- поле для кода с подчёркиванием ошибок ----------
   ХИТРОСТЬ: в обычном <textarea> нельзя подчеркнуть кусок текста. Поэтому под ним лежит
   второй слой (.back) с ТОЧНО ТАКИМ ЖЕ текстом, но невидимым — а ошибочный кусок в нём
   обёрнут в <mark> с красной волнистой линией. Textarea сверху прозрачный, и получается,
   что подчёркивание «прилипло» к тексту. */
.code-wrap {
  position: relative;                      /* чтобы слой .back мог позиционироваться относительно этой обёртки */
  margin-top: 16px;
  background: var(--code-bg);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  overflow: hidden;                        /* всё, что вылезает за скруглённые углы, обрезается */
  transition: border-color .15s, box-shadow .15s;
}
/* когда внутри обёртки выбран textarea — подсвечиваем рамку и добавляем лёгкое свечение */
.code-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
/* ВАЖНО: у невидимого слоя и у textarea должны быть ОДИНАКОВЫЕ шрифт и отступы, иначе подчёркивание «уедет» */
.code-wrap .back, .code-wrap textarea {
  font: 14px/1.65 var(--mono);             /* моноширинный шрифт 14px */
  tab-size: 4;                             /* символ Tab = 4 пробела по ширине */
  white-space: pre;                        /* не переносить длинные строки, сохранять все пробелы */
  padding: 14px 16px;
  margin: 0;
}
.back { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }  /* слой растянут на всю обёртку, не ловит клики мыши (pointer-events: none) */
.back-in { color: transparent; will-change: transform; }                            /* внутри слоя текст невидим; will-change — подсказка браузеру, что будем двигать (быстрее) */
.back-in mark {                            /* <mark> — тот самый кусок кода с ошибкой */
  background: transparent; color: transparent;   /* сам текст невидим... */
  text-decoration: underline wavy var(--err);    /* ...но подчёркнут красной волнистой линией */
  text-decoration-thickness: 1.5px;
  text-underline-offset: 4px;              /* линия чуть ниже текста, чтобы не сливалась с буквами */
}
.code-wrap textarea {
  position: relative;                      /* лежит поверх слоя .back */
  display: block;
  width: 100%;
  min-height: 220px;                       /* минимальная высота поля */
  resize: vertical;                        /* тянуть можно только вверх-вниз */
  border: 0; outline: 0;                   /* без собственной рамки */
  background: transparent;                 /* прозрачный фон, чтобы было видно подчёркивание снизу */
  color: var(--text);                      /* а сам текст — видимый */
  overflow: auto;                          /* полосы прокрутки, если код не помещается */
}
.err { min-height: 20px; margin: 6px 2px 0; font-size: 13px; color: var(--err); }   /* строка с текстом ошибки под полем кода */

/* ---------- кнопки ---------- */
button {                                   /* базовый стиль ВСЕХ кнопок */
  font: inherit; cursor: pointer;          /* курсор-«рука» при наведении */
  color: var(--text);
  background: transparent;
  border: 1px solid var(--line-strong);
  border-radius: 999px;                    /* огромный радиус = полностью круглые края («таблетка») */
  padding: 9px 20px;
  transition: background .15s, border-color .15s, opacity .15s, transform .18s, box-shadow .25s;   /* плавные изменения, в том числе подъём и тень */
}
button:hover { border-color: var(--accent); transform: translateY(-1px); }          /* при наведении рамка становится терракотовой */
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); padding: 13px 34px; margin-top: 8px; }  /* главная кнопка — залита цветом */
button.primary:hover { opacity: .9; border-color: var(--accent); }   /* при наведении чуть светлее */
button.small { padding: 4px 12px; font-size: 13px; }   /* маленькие кнопки («Копировать», «↑») */
button.danger { color: var(--err); }                   /* опасные действия («Удалить») — красным */
button:disabled { opacity: .45; cursor: default; }     /* недоступная кнопка — бледная */
.msg { min-height: 22px; font-size: 14px; margin: 12px 0 0; }   /* строка сообщений («Сохранено», ошибки) */
.msg.bad { color: var(--err); }                        /* если сообщение об ошибке — красное */
.foot { margin-top: 40px; text-align: center; font-size: 13px; }   /* низ страницы со ссылкой «Для преподавателя» */
.foot a, .back-link { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }  /* ссылки: серые, без подчёркивания, но с тонкой линией снизу */
.foot a:hover, .back-link:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- экран «Работа отправлена» ---------- */
.done { text-align: center; padding: 72px 0; }
.done .mark { position: relative; width: 76px; height: 76px; margin: 0 auto 24px; }   /* контейнер для анимированной галочки в кружке */
.done .mark svg { width: 100%; height: 100%; overflow: visible; }                       /* SVG-картинка на весь контейнер */
.done .mark circle, .done .mark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }  /* линии без заливки, терракотовые, с круглыми концами */
.done .mark circle { stroke-dasharray: 151; stroke-dashoffset: 151; animation: draw .7s cubic-bezier(.4,0,.2,1) .1s forwards; }   /* кружок «рисуется»: длина линии 151, смещение уменьшается до 0 */
.done .mark path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .4s cubic-bezier(.4,0,.2,1) .65s forwards; }        /* потом так же рисуется галочка */
.done .mark::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); opacity: 0; animation: ring .9s ease-out .7s; }  /* расходящееся кольцо-вспышка */

/* ---------- админка ---------- */
.bar { display: flex; align-items: center; gap: 22px; margin-bottom: 36px; border-bottom: 1px solid var(--line); }  /* верхняя панель с вкладками (flex = элементы в ряд) */
.bar button.tab { position: relative; border: 0; border-radius: 0; padding: 10px 0; margin-bottom: -1px; color: var(--muted); }  /* вкладка: кнопка без рамки; полоску снизу рисует ::after (см. анимации) */
.bar button.tab.active { color: var(--text); }   /* активная вкладка: тёмный текст */
.bar .spacer { flex: 1; }                  /* «пружина»: занимает всё свободное место и отталкивает «Выйти» вправо */
.bar button.out { border: 0; color: var(--muted); padding: 10px 0; }   /* кнопка «Выйти» */
.sub { border-bottom: 1px solid var(--line); transition: max-height .38s ease, opacity .3s ease, transform .38s ease; }   /* одна сданная работа; transition нужен для плавного удаления */
.sub-head { display: flex; align-items: baseline; gap: 12px; padding: 16px 2px; cursor: pointer; }  /* строка с фамилией (на неё кликаем, чтобы раскрыть) */
.sub-head .name { font: 400 19px var(--serif); flex: 1; }   /* фамилия и имя — слева, занимают всё место */
.sub-head .arrow { color: var(--muted); transition: transform .2s; }   /* стрелочка › */
.sub.open .arrow { transform: rotate(90deg); }   /* когда работа раскрыта — стрелка поворачивается вниз */
.sub-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .38s cubic-bezier(.2,.8,.2,1); }   /* тело работы: высота строки 0fr = свёрнуто. Это приём, который позволяет плавно анимировать «раскрытие» */
.sub.open .sub-body { grid-template-rows: 1fr; }   /* у раскрытой работы строка тянется на всю высоту содержимого (1fr) — плавно за 0.38 сек */
.sub-in { overflow: hidden; min-height: 0; padding: 0 2px; }   /* внутренняя обёртка: обрезает содержимое, пока строка схлопнута */
.sub-pad { padding-bottom: 22px; }                              /* нижний отступ внутри обёртки (снаружи он бы не схлопывался) */
.ans-head { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; }  /* строка «Название задачи [Копировать]» */
.ans-head b { flex: 1; font: 400 16px var(--serif); }
pre.answer {                               /* блок с кодом ученика в админке; <pre> сохраняет пробелы и переносы */
  margin: 0; padding: 14px 16px; background: var(--code-bg);
  border: 1px solid var(--line); border-radius: 10px;
  overflow: auto; font: 14px/1.65 var(--mono); tab-size: 4;
}
.search { margin-bottom: 8px; }            /* поле поиска */
.count { font-size: 13px; margin: 0 0 8px; }   /* надпись «Работ: N» */
.empty { text-align: center; color: var(--muted); padding: 56px 0; }   /* пустые состояния («Пока никто ничего не сдал») */

.field { margin-bottom: 28px; }            /* обёртка поля в настройках */
.check {                                   /* строка с галочкой в настройках */
  display: flex; gap: 12px; align-items: flex-start; cursor: pointer; margin-bottom: 18px;
  text-transform: none; letter-spacing: 0; font-size: 16px; color: var(--text);   /* отменяем стиль <label> (заглавные буквы и т.п.) */
}
.check input {                             /* рисуем свою галочку вместо стандартной */
  appearance: none; -webkit-appearance: none;   /* отключаем стандартный вид браузера */
  flex: none; width: 22px; height: 22px; margin: 2px 0 0;
  border: 1px solid var(--line-strong); border-radius: 6px; background: var(--paper);
  display: grid; place-items: center; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.check input:checked { background: var(--accent); border-color: var(--accent); }   /* когда включена — заливаем цветом */
.check input:checked::after {              /* ::after — «виртуальный элемент» внутри квадрата: рисуем самой галочку */
  content: ""; width: 5px; height: 10px; margin-top: -2px;
  border: solid #fff; border-width: 0 2px 2px 0;   /* только нижняя и правая линии белого цвета... */
  transform: rotate(45deg);                          /* ...повёрнутые на 45° — получилась «✓» */
}
.check small { display: block; color: var(--muted); font-size: 13px; }   /* маленькая подпись под названием галочки */
.task-edit { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; background: var(--code-bg); }   /* карточка редактирования одной задачи */
.task-edit .top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }   /* верхний ряд: название + кнопки */
.task-edit .top input { flex: 1; }         /* поле названия растягивается */
.login { max-width: 360px; margin: 0 auto; }   /* форма входа: узкая и опущена вниз (12vh = 12% высоты окна) */

/* ---------- окно подтверждения (модальное) ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;   /* на весь экран, карточка по центру */
  background: rgba(42,37,32,.38); backdrop-filter: blur(5px);                                    /* затемнение и размытие всего, что за окном */
  animation: fade .2s ease;
}
.modal.closing { opacity: 0; transition: opacity .18s ease; }            /* при закрытии плавно тает */
.modal-card {
  width: 100%; max-width: 440px; background: var(--paper); border: 1px solid var(--line);
  border-radius: 22px; padding: 30px 30px 26px; box-shadow: 0 30px 80px -30px rgba(60,40,15,.5);
  animation: pop .35s cubic-bezier(.2,1.3,.4,1);                         /* «выпрыгивает» с пружинкой */
}
.modal-card h2 { margin-bottom: 12px; }
.modal-text p { margin: 0 0 10px; }
.modal-text .warn { color: var(--err); }                                 /* предупреждение «не заполнено…» */
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; flex-wrap: wrap; }
button.dangerous { background: var(--err); border-color: var(--err); }   /* красная кнопка подтверждения для опасных действий */

/* ---------- экран «Работа отправлена» и действия ученика ---------- */
.actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }    /* ряд кнопок */
.done .actions { justify-content: center; margin-top: 28px; }                    /* на экране статуса кнопки по центру */
.done .meta { margin: 6px 0 0; font-size: 14px; }                                /* строка «Иван Петров · отправлено … · исправлена 2 раза» */

/* ---------- метки и история изменений в админке ---------- */
.chip { font-size: 12px; line-height: 1; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line-strong); color: var(--muted); white-space: nowrap; }  /* маленькая «таблетка»-метка */
.chip.edit { color: var(--accent); border-color: var(--accent); }                /* «исправлено N раз» — терракотовая */
.chip.off { color: var(--err); border-color: var(--err); }                       /* «отозвана» — красная */
.hist { margin-top: 22px; padding-top: 16px; border-top: 1px dashed var(--line-strong); }   /* блок «История изменений» */
.hist-title { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.hev { margin: 8px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--code-bg); }  /* одно событие истории */
.hev-sum { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; padding: 11px 14px; cursor: pointer; list-style: none; }
details.hev > summary::-webkit-details-marker { display: none; }                 /* прячем стандартный треугольник у <details> */
details.hev > summary::before { content: "›"; color: var(--muted); display: inline-block; transition: transform .2s; }   /* вместо него свой, поворачивается при раскрытии */
details.hev[open] > summary::before { transform: rotate(90deg); }
div.hev > .hev-sum { cursor: default; }                                          /* у записей без раскрытия (сдана / отозвана) курсор обычный */
.hev-body { padding: 0 14px 14px; }
.hev-name { margin: 0 0 6px; font-size: 14px; }
.cmp-l { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }   /* подписи «До» и «После» */
.dl { display: block; min-height: 1.65em; margin: 0 -16px; padding: 0 16px; }    /* одна строка кода в сравнении (блок на всю ширину) */
.dl.del { background: rgba(200,64,47,.14); }                                     /* строка, которую убрали — красноватая */
.dl.add { background: rgba(90,140,70,.18); }                                     /* строка, которую добавили — зеленоватая */

/* ---------- вход: имя и фамилия, затем задачи ---------- */
#form { margin-top: 0; }                                       /* заголовка на странице ученика нет — форма сразу вверху */
main:has(#step1:not([hidden])), main:has(.done), main:has(.login) { margin: auto; }   /* лист ровно по центру экрана (и по вертикали тоже) на экранах входа, статуса и логина админа */
#step1 { max-width: 380px; margin: 12px auto 8px; }               /* первый шаг — узкая колонка по центру листа */
#step1 h1 { text-align: center; font-size: 32px; margin: 0 0 32px; }   /* заголовок «Регистрация» по центру */
#step1 .names { grid-template-columns: 1fr; gap: 26px; }          /* имя и фамилия друг под другом (вертикально), а не рядом */
#step1 .names input { font-size: 20px; padding: 12px 2px; }    /* на первом экране поля покрупнее */
#step1 .actions .primary { width: 100%; }                         /* кнопка «Продолжить» на всю ширину колонки */
#step1 .names { padding-bottom: 12px; }
#step1 .actions { margin-top: 22px; }                         /* кнопка «Продолжить» чуть ниже полей */
#step1.fading, #step2.fading { opacity: 0; transform: translateY(-6px); transition: opacity .16s ease, transform .16s ease; }   /* шаг плавно тает при переходе */
.who { display: flex; align-items: baseline; gap: 14px; padding-bottom: 22px; font: 400 20px var(--serif); }   /* строка «Иван Петров · Изменить» над задачами */
.linkbtn { background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 0; color: var(--muted); font: 400 13px var(--sans); }   /* кнопка, выглядящая как ссылка */
.linkbtn:hover { color: var(--accent); border-color: var(--accent); transform: none; }

/* ---------- АНИМАЦИИ ----------
   @keyframes — это «сценарий» анимации: что с элементом происходит от начала (from) до конца (to).
   Подключается свойством animation: имя длительность функция-плавности задержка режим. */

/* Плавное появление: блок выезжает снизу и проявляется */
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
/* Класс .rise навешивает JS (функция reveal). --i — порядковый номер элемента, из него считается задержка: каждый следующий блок появляется на 60мс позже («каскад»).
   backwards = пока ждём задержку, элемент невидим; после конца анимации стили возвращаются к обычным (иначе hover/transition перестали бы работать) */
.rise { animation: rise .6s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i, 0) * 60ms); }

/* Уход страницы: перед переключением лист чуть уезжает вверх и тает (класс ставит JS в функции leave) */
main.leaving { opacity: 0; transform: translateY(-8px) scale(.992); }

/* Кнопка при нажатии «вдавливается» (стоит ПОСЛЕ :hover, чтобы перебить подъём) */
button:active { transform: translateY(0) scale(.96); }
/* Главная кнопка при наведении светится терракотовой тенью */
button.primary:hover { box-shadow: 0 10px 24px -10px rgba(180,98,60,.7); }
/* Не поднимаем вкладки и «Выйти» — им подъём не нужен */
.bar button:hover { transform: none; }

/* Крутилка на главной кнопке, пока идёт отправка (класс .loading ставит JS) */
@keyframes spin { to { transform: rotate(360deg); } }
button.loading { color: transparent; pointer-events: none; }   /* прячем надпись и блокируем клики */
button.loading::after {                                          /* рисуем кружок с «хвостиком» посередине кнопки */
  content: ""; position: absolute; inset: 0; margin: auto; width: 18px; height: 18px;
  border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; border-radius: 50%;
  animation: spin .7s linear infinite;                           /* бесконечное вращение */
}
button.primary { position: relative; }                           /* чтобы крутилка позиционировалась внутри кнопки */

/* Сообщения об ошибках и «Сохранено» плавно проявляются, когда в них появляется текст (:not(:empty) = «не пустой») */
@keyframes msgIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }
.err:not(:empty), .msg:not(:empty) { animation: msgIn .3s ease; }

/* Подпись над полем становится терракотовой, пока в поле печатают */
label { transition: color .2s; }
.names > div:focus-within label { color: var(--accent); }
/* Поле кода слегка приподнимается при наведении */
.code-wrap:hover { border-color: var(--accent); }

/* Полоска под активной вкладкой «вырастает» слева направо */
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.bar button.tab.active::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
  background: var(--accent); transform-origin: left;
  animation: grow .45s cubic-bezier(.2,.8,.2,1) .1s backwards;
}

/* Строка работы в админке: при наведении фамилия краснеет в терракоту */
.sub-head .name { transition: color .2s; }
.sub-head:hover .name { color: var(--accent); }
/* Удаляемая работа уезжает вправо и схлопывается (max-height в 0 выставляет JS) */
.sub.removing { opacity: 0; transform: translateX(44px); overflow: hidden; border-bottom-color: transparent; }

/* Кнопка «Копировать» коротко «пульсирует» после нажатия */
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
button.pulse { animation: pulse .35s ease; }

/* Новая задача в настройках «выпрыгивает» с пружинкой */
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(-8px); } to { opacity: 1; transform: none; } }
.task-edit.pop { animation: pop .45s cubic-bezier(.2,1.3,.4,1); }

/* Галочка в настройках «выскакивает» при включении */
@keyframes tick { from { transform: rotate(45deg) scale(0); } to { transform: rotate(45deg) scale(1); } }
.check input:checked::after { animation: tick .3s cubic-bezier(.2,1.5,.4,1); }

/* Неверный пароль: форма трясётся из стороны в сторону */
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(3px); } }
.login.shake { animation: shake .45s ease; }

/* Экран «Работа отправлена»: рисование кружка/галочки, вспышка-кольцо */
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.9); } }

/* Конфетти: каждый кусочек летит по своей траектории (--dx, --dy, --rot задаёт JS случайно) и падает вниз с затуханием */
@keyframes confetti {
  from { opacity: 1; transform: translate(-50%, -50%) rotate(0deg); }
  to   { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 140px)) rotate(var(--rot)); }
}
.confetti { position: fixed; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; z-index: 50; animation: confetti 1.2s cubic-bezier(.2,.7,.3,1) forwards; }

/* Мягкие цветные пятна на фоне медленно «плавают». fixed = прибиты к окну, blur = размытие, pointer-events: none = не мешают кликам */
@keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(90px, 70px) scale(1.15); } }
@keyframes drift2 { from { transform: translate(0, 0) scale(1); } to { transform: translate(-80px, -60px) scale(1.2); } }
body::before, body::after { content: ""; position: fixed; z-index: 0; border-radius: 50%; filter: blur(70px); opacity: .55; pointer-events: none; }
body::before { width: 420px; height: 420px; left: -120px; top: -100px; background: #f0d9bd; animation: drift1 18s ease-in-out infinite alternate; }
body::after  { width: 480px; height: 480px; right: -140px; bottom: -140px; background: #ecd0c0; animation: drift2 22s ease-in-out infinite alternate; }

/* Если у человека в системе включено «уменьшить движение» (для тех, кого тошнит от анимаций) — отключаем всё */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- адаптация под телефон ----------
   Правила внутри действуют только если окно не шире 560px */
@media (max-width: 560px) {
  body { padding: 12px; }
  main { padding: 28px 20px 28px; border-radius: 18px; }   /* на телефоне отступы внутри листа меньше */
  h1 { font-size: 28px; }
  .names { grid-template-columns: 1fr; gap: 20px; }          /* имя и фамилия — друг под другом, а не рядом */
}
